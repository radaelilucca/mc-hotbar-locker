plugins {
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_id}-neoforge"
}

sourceSets {
    main {
        java.srcDir('../common/src/main/java')
        resources.srcDir('../common/src/main/resources')
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
        }
        serverSmoke {
            server()
            gameDirectory = project.file('build/server-smoke')
            // Unlike --initSettings, an invalid world name exits AFTER mod loading.
            // This deliberately stops before creating a world or opening a port.
            programArgument '--world='
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    def properties = [
        version: "${mod_version}+${minecraft_version}",
        mod_id: mod_id,
        mod_name: mod_name,
        mod_description: mod_description,
        mod_authors: mod_authors,
        mod_license: mod_license,
        minecraft_version: minecraft_version,
        neoforge_version: neoforge_version,
        neoforge_loader_version_range: neoforge_loader_version_range
    ]
    inputs.properties(properties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

tasks.named('runServerSmoke') {
    timeout = java.time.Duration.ofMinutes(3)
    doFirst {
        // Prevent a previous successful log from satisfying this run's assertions.
        def log = file('build/server-smoke/logs/latest.log')
        if (log.exists()) log.text = ''
    }
    doLast {
        def log = file('build/server-smoke/logs/latest.log').text
        if (!log.contains('hotbarlocker common bootstrap initialized on NeoForge') ||
            !log.contains('Invalid world directory specified') ||
            log.contains('Failed to start the minecraft server') ||
            log.contains('invalid dist DEDICATED_SERVER')) {
            throw new GradleException('Dedicated server bootstrap failed; inspect neoforge/build/server-smoke/logs/latest.log')
        }
    }
}
