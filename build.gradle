plugins {
    id 'base'
    id 'fabric-loom' version '1.9.2' apply false
    id 'net.neoforged.moddev' version '2.0.140' apply false
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)' apply false
}

allprojects {
    group = mod_group_id
    version = mod_version
}

tasks.register('verifyScaffold') {
    group = 'verification'
    description = 'Builds the common, Fabric, Forge, and NeoForge scaffold artifacts.'
    dependsOn(':common:check', ':fabric:build', ':forge:build', ':neoforge:build')
    dependsOn(':neoforge:runServerSmoke')
}
